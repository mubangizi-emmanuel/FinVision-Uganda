<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expenses - FinVision Uganda</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
}

header{
    background:#dc3545;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

h2{
    color:#dc3545;
}

.form-group{
    margin-bottom:15px;
}

label{
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}


button{
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-right:10px;
    font-size:15px;
}


.save{
    background:#198754;
    color:white;
}

.clear{
    background:#dc3545;
    color:white;
}

.back{
    background:#6c757d;
    color:white;
}


table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
}


th{
    background:#dc3545;
    color:white;
    padding:12px;
}


td{
    padding:10px;
    border:1px solid #ddd;
}


</style>

</head>


<body>


<header>

<h1>FinVision Uganda</h1>
<p>Expense Management</p>

</header>



<div class="container">


<h2>Record New Expense</h2>


<form>


<div class="form-group">

<label>Expense Name</label>

<input type="text" placeholder="Example: Transport, Rent, Electricity">

</div>



<div class="form-group">

<label>Category</label>

<select>

<option>Transport</option>
<option>Rent</option>
<option>Utilities</option>
<option>Salaries</option>
<option>Stock Purchase</option>
<option>Other</option>

</select>

</div>




<div class="form-group">

<label>Amount (UGX)</label>

<input type="number" placeholder="Enter expense amount">

</div>




<div class="form-group">

<label>Date</label>

<input type="date">

</div>




<div class="form-group">

<label>Payment Method</label>

<select>

<option>Cash</option>
<option>Mobile Money</option>
<option>Bank</option>

</select>

</div>




<div class="form-group">

<label>Description</label>

<textarea placeholder="Enter expense details"></textarea>

</div>




<div>

<button class="save" type="submit">
Save Expense
</button>


<button class="clear" type="reset">
Clear
</button>


<button class="back" type="button" onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</div>



<form onsubmit="saveExpense(); return false;">

<div class="form-group">
<label>Expense Name</label>
<input type="text" id="expenseName" placeholder="Example: Transport">
</div>

<div class="form-group">
<label>Category</label>
<select id="category">
<option>Transport</option>
<option>Rent</option>
<option>Utilities</option>
<option>Salaries</option>
<option>Stock Purchase</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Amount (UGX)</label>
<input type="number" id="amount" placeholder="Enter amount">
</div>

<div class="form-group">
<label>Date</label>
<input type="date" id="expenseDate">
</div>

<div class="form-group">
<label>Payment Method</label>
<select id="paymentMethod">
<option>Cash</option>
<option>Mobile Money</option>
<option>Bank</option>
</select>
</div>

<div class="form-group">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div>

<button class="save" type="submit">
Save Expense
</button>

<button class="clear" type="reset">
Clear
</button>

<button class="back" type="button"
onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</div>

</form>

<div id="expenseResult"></div>




<h2>Recent Expenses</h2>


<table>


<tr>

<th>Expense</th>
<th>Category</th>
<th>Amount</th>
<th>Date</th>
<th>Payment</th>

</tr>



<tr>

<td>No expenses recorded</td>
<td>-</td>
<td>-</td>
<td>-</td>
<td>-</td>

</tr>



</table>



</div>
<script type="module" src="script.js"></script>
<footer>
© 2026 FinVision Uganda | Version 1.0 <br>
Developed by MUBANGIZI EMMANUEL
</footer>


</body>
</html>
