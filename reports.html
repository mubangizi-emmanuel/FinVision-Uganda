<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinVision Uganda Reports</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
}

header{
background:#0B6E4F;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
max-width:1200px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px lightgray;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#eef4f8;
padding:20px;
border-radius:10px;
text-align:center;
}

.card h3{
margin:0;
color:#0B6E4F;
}

.card h2{
margin-top:15px;
}

button{
background:#0B6E4F;
color:white;
padding:12px 18px;
border:none;
border-radius:6px;
cursor:pointer;
margin:5px;
}

button:hover{
background:green;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th{
background:#0B6E4F;
color:white;
padding:12px;
}

table td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

footer{
margin-top:30px;
background:#0B6E4F;
color:white;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>
<h2>Financial Reports</h2>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Sales</h3>
<h2 id="totalSales">UGX 0</h2>
</div>

<div class="card">
<h3>Total Expenses</h3>
<h2 id="totalExpenses">UGX 0</h2>
</div>

<div class="card">
<h3>Net Profit</h3>
<h2 id="netProfit">UGX 0</h2>
</div>

<div class="card">
<h3>Total Transactions</h3>
<h2 id="transactions">0</h2>
</div>

</div>
<h2>Generate Reports</h2>

<button onclick="loadReport('daily')">Daily</button>
<button onclick="loadReport('weekly')">Weekly</button>
<button onclick="loadReport('monthly')">Monthly</button>
<button onclick="loadReport('quarterly')">Quarterly</button>
<button onclick="loadReport('yearly')">Yearly</button>

<button onclick="window.print()">Print Report</button>

<button onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

<h2 id="reportTitle">Report Details</h2>

<table>

<thead>

<tr>

<th>Date</th>
<th>Product</th>
<th>Customer</th>
<th>Payment</th>
<th>Total (UGX)</th>

</tr>

</thead>

<tbody id="reportTable">

<tr>

<td colspan="5">
No records found

</td>

</tr>

</tbody>

</table>

</div>

<script type="module" src="script.js"></script>

<footer>

© 2026 FinVision Uganda | Version 1.0<br>
Developed by MUBANGIZI EMMANUEL

</footer>

</body>
</html>
