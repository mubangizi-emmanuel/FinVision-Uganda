<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - FinVision Uganda</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#eef4f8;
    text-align:center;
    padding-top:50px;
}


.container{

    background:white;
    width:350px;
    margin:auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;

}


input{

    width:90%;
    padding:12px;
    margin:15px 0;
    border:1px solid #ccc;
    border-radius:5px;

}


button{

    background:#0b6e4f;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;

}


button:hover{

    background:#09543d;

}


#message{

    color:green;
    font-weight:bold;

}

</style>

</head>


<body>


<div class="container">


<h1>FinVision Uganda</h1>

<h2>Reset Password</h2>


<p>Enter your email or username</p>


<input type="text" id="username" placeholder="Email or Username">



<br>


<button onclick="resetPassword()">

Reset Password

</button>



<p id="message"></p>


<p>&copy; 2026 FinVision Uganda. All Rights Reserved.</p>


</div>



<script>


function resetPassword(){


let user = document.getElementById("username").value;


if(user==""){

document.getElementById("message").innerHTML =
"Please enter your email or username";

}


else{


document.getElementById("message").innerHTML =
"Password reset request successful";


setTimeout(function(){

window.location.href="change-password.html";

},1500);


}


}


<script type="module" src="script.js"></script>
<footer>
© 2026 FinVision Uganda | Version 1.0 <br>
Developed by MUBANGIZI EMMANUEL
</footer>


</body>

</html>
