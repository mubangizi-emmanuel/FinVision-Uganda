<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products - FinVision Uganda</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef4f8;
    margin:0;
}

header{
    background:#0B6E4F;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

h2{
    color:#0B6E4F;
}

.form-group{
    margin-bottom:15px;
}

label{
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-right:10px;
    margin-top:10px;
    font-size:15px;
}

.save{
    background:#198754;
    color:white;
}

.clear{
    background:#dc3545;
    color:white;
}

.back{
    background:#6c757d;
    color:white;
}

table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
}

th{
    background:#0B6E4F;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
}

#productResult{
    margin-top:20px;
    color:green;
    font-weight:bold;
}

footer{
    margin-top:30px;
    text-align:center;
    padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>
<p>Product Management</p>

</header>

<div class="container">

<h2>Add Product</h2>

<form onsubmit="saveProduct(); return false;">

<div class="form-group">
<label>Product Name</label>
<input type="text" id="productName" placeholder="Enter product name">
</div>

<div class="form-group">
<label>Category</label>
<select id="productCategory">
<option>Beverages</option>
<option>Food</option>
<option>Electronics</option>
<option>Clothing</option>
<option>Stationery</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Buying Price (UGX)</label>
<input type="number" id="buyPrice" placeholder="Buying price">
</div>

<div class="form-group">
<label>Selling Price (UGX)</label>
<input type="number" id="sellPrice" placeholder="Selling price">
</div>

<div class="form-group">
<label>Quantity</label>
<input type="number" id="productQuantity" placeholder="Quantity">
</div>

<div class="form-group">
<label>Date Added</label>
<input type="date" id="productDate">
</div>

<button class="save" type="submit">
Save Product
</button>

<button class="clear" type="reset">
Clear
</button>

<button class="back" type="button"
onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</form>

<div id="productResult"></div>

<h2>Product Records</h2>

<table>

<thead>

<tr>
<th>Product</th>
<th>Category</th>
<th>Buying Price</th>
<th>Selling Price</th>
<th>Quantity</th>
</tr>

</thead>

<tbody id="productTable">

<tr>
<td colspan="5">
No products added.
</td>
</tr>

</tbody>

</table>

</div>

<script type="module" src="script.js"></script>

<footer>

© 2026 FinVision Uganda | Version 1.0<br>
Developed by MUBANGIZI EMMANUEL

</footer>

</body>
</html>
