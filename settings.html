<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings - FinVision Uganda</title>


<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    transition:0.3s;
}


header{
    background:#212529;
    color:white;
    padding:20px;
    text-align:center;
}


.container{

width:90%;
max-width:900px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px #ccc;

}



h2{
color:#212529;
}



.form-group{

margin-bottom:15px;

}


label{

font-weight:bold;

}



input,select{

width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;

}



button{

padding:12px 18px;
border:none;
border-radius:5px;
cursor:pointer;
margin:5px;

}



.save{

background:#198754;
color:white;

}



.reset{

background:#dc3545;
color:white;

}



.dark{

background:#343a40;
color:white;

}



.back{

background:#6c757d;
color:white;

}



.message{

margin-top:15px;
font-weight:bold;
color:#198754;

}



</style>


</head>


<body>



<header>

<h1>FinVision Uganda</h1>

<p>System Settings</p>

</header>



<div class="container">



<h2>General Settings</h2>




<div class="form-group">

<label>Business Name</label>

<input id="businessName" type="text" placeholder="Enter business name">

</div>



<div class="form-group">

<label>Currency</label>

<select id="currency">

<option>UGX</option>
<option>USD</option>
<option>KES</option>

</select>

</div>




<div class="form-group">

<label>Language</label>

<select id="language">

<option>English</option>
<option>Luganda</option>

</select>

</div>




<div class="form-group">

<label>Notification Settings</label>

<select id="notification">

<option>Enabled</option>
<option>Disabled</option>

</select>

</div>




<button class="save" onclick="saveSettings()">

Save Settings

</button>



<button class="reset" onclick="resetSettings()">

Reset

</button>



<button class="dark" onclick="darkMode()">

Dark Mode

</button>




<p class="message" id="message"></p>




<h2>Account Options</h2>



<button class="back" onclick="location.href='dashboard.html'">

Back to Dashboard

</button>



</div>




<script>


function saveSettings(){


let name=document.getElementById("businessName").value;


localStorage.setItem("businessName",name);

localStorage.setItem("currency",
document.getElementById("currency").value);


localStorage.setItem("language",
document.getElementById("language").value);


localStorage.setItem("notification",
document.getElementById("notification").value);



document.getElementById("message").innerHTML =
"Settings saved successfully!";


}



function resetSettings(){


document.getElementById("businessName").value="";

document.getElementById("message").innerHTML =
"Settings cleared";


}



function darkMode(){


document.body.style.background="#212529";

document.querySelector(".container").style.background="#343a40";

document.querySelector(".container").style.color="white";


document.getElementById("message").innerHTML =
"Dark mode activated";


}



<script type="module" src="script.js"></script>
<footer>
© 2026 FinVision Uganda | Version 1.0 <br>
Developed by MUBANGIZI EMMANUEL
</footer>



</body>

</html>
