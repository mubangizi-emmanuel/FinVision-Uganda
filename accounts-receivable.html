<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accounts Receivable | FinVision Uganda</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef4f8;
color:#333;
}

header{
background:#0B6E4F;
color:white;
text-align:center;
padding:20px;
}

header h1{
margin-bottom:5px;
}

.container{
width:95%;
max-width:1200px;
margin:25px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
color:#0B6E4F;
margin-bottom:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#f8f9fa;
padding:20px;
border-radius:8px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.card h3{
color:#0B6E4F;
margin-bottom:10px;
}

.card p{
font-size:22px;
font-weight:bold;
}

.buttons{
margin-bottom:25px;
}

button{
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
margin-right:10px;
margin-bottom:10px;
transition:.3s;
}

.print{
background:#0d6efd;
color:white;
}

.back{
background:#6c757d;
color:white;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0B6E4F;
color:white;
padding:12px;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

tfoot td{
font-weight:bold;
background:#f2f2f2;
}

footer{
margin-top:30px;
background:#0B6E4F;
color:white;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>

<p>Accounts Receivable</p>

</header>

<div class="container">

<h2>Accounts Receivable</h2>
<div class="summary">

<div class="card">
<h3>Total Receivable</h3>
<p id="totalReceivable">UGX 0</p>
</div>

</div>

<div class="buttons">

<button
class="print"
onclick="window.print();">
🖨 Print Receivables
</button>

<button
class="back"
onclick="window.location.href='dashboard.html';">
🏠 Back to Dashboard
</button>

</div>

<h2>Outstanding Customers</h2>

<table>

<thead>

<tr>

<th>Customer</th>
<th>Product</th>
<th>Date</th>
<th>Amount (UGX)</th>
<th>Payment Status</th>

</tr>

</thead>

<tbody id="receivableTable">

<tr>

<td colspan="5">

No Outstanding Receivables

</td>

</tr>

</tbody>

<tfoot>

<tr>

<td colspan="3">
<strong>Total Outstanding</strong>
</td>

<td id="footerReceivable">
UGX 0
</td>

<td>-</td>

</tr>

</tfoot>

</table>

<div id="receivableMessage"
style="
margin-top:20px;
font-weight:bold;
color:green;
text-align:center;">
</div>
<script>

// Automatically load Accounts Receivable
window.onload = function(){

    if(typeof loadAccountsReceivable === "function"){

        loadAccountsReceivable();

    }

};

// Print Accounts Receivable
function printReceivables(){

    window.print();

}

</script>

<script type="module" src="script.js"></script>

<footer>

© 2026 FinVision Uganda | Version 1.0<br>
Developed by MUBANGIZI EMMANUEL

</footer>

</body>
</html>
