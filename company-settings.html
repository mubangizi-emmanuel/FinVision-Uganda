<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Settings | FinVision Uganda</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef4f8;
color:#333;
}

header{
background:#0B6E4F;
color:white;
text-align:center;
padding:20px;
}

header h1{
margin-bottom:5px;
}

.container{
width:95%;
max-width:900px;
margin:25px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
color:#0B6E4F;
margin-bottom:20px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#0B6E4F;
}

textarea{
resize:vertical;
min-height:100px;
}

.buttons{
margin-top:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
margin-right:10px;
margin-bottom:10px;
}

.save{
background:#198754;
color:white;
}

.back{
background:#6c757d;
color:white;
}

button:hover{
opacity:.9;
}

footer{
margin-top:30px;
background:#0B6E4F;
color:white;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>

<p>Company Settings</p>

</header>

<div class="container">

<h2>Company Information</h2>
<form onsubmit="saveCompanySettings(); return false;">

<div class="form-group">

<label>Company Name</label>

<input
type="text"
id="companyName"
placeholder="Enter Company Name">

</div>

<div class="form-group">

<label>Company Email</label>

<input
type="email"
id="companyEmail"
placeholder="Enter Company Email">

</div>

<div class="form-group">

<label>Company Phone</label>

<input
type="text"
id="companyPhone"
placeholder="Enter Company Phone">

</div>

<div class="form-group">

<label>Company Address</label>

<textarea
id="companyAddress"
placeholder="Enter Company Address"></textarea>

</div>

<div class="form-group">

<label>Tax Identification Number (TIN)</label>

<input
type="text"
id="companyTIN"
placeholder="Enter TIN">

</div>

<div class="form-group">

<label>Currency</label>

<select id="companyCurrency">

<option value="UGX">Ugandan Shilling (UGX)</option>

<option value="USD">US Dollar (USD)</option>

<option value="KES">Kenyan Shilling (KES)</option>

<option value="TZS">Tanzanian Shilling (TZS)</option>

<option value="RWF">Rwandan Franc (RWF)</option>

</select>

</div>

<div class="buttons">

<button
type="submit"
class="save">

💾 Save Settings

</button>

<button
type="button"
class="back"
onclick="window.location.href='dashboard.html';">

🏠 Back to Dashboard

</button>

</div>

</form>

<div id="settingsMessage"
style="
margin-top:20px;
font-weight:bold;
color:green;
text-align:center;">
</div>
<script>

// Automatically load company settings
window.onload = function(){

    if(typeof loadCompanySettings === "function"){

        loadCompanySettings();

    }

};

// Print Company Settings
function printCompanySettings(){

    window.print();

}

</script>

<script type="module" src="script.js"></script>

<footer>

© 2026 FinVision Uganda | Version 1.0<br>
Developed by MUBANGIZI EMMANUEL

</footer>

</body>
</html>
