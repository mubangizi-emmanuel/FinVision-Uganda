<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers - FinVision Uganda</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
}

header{
    background:#6f42c1;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

h2{
    color:#6f42c1;
}

.form-group{
    margin-bottom:15px;
}

label{
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-right:10px;
    margin-top:10px;
    font-size:15px;
}

.save{
    background:#198754;
    color:white;
}

.clear{
    background:#dc3545;
    color:white;
}

.back{
    background:#6c757d;
    color:white;
}

table{
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
}

th{
    background:#6f42c1;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
}

#customerResult{
    margin-top:20px;
    font-weight:bold;
    color:green;
}

footer{
    margin-top:30px;
    text-align:center;
    padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>
<p>Customer Management</p>

</header>

<div class="container">

<h2>Add New Customer</h2>

<form onsubmit="saveCustomer(); return false;">

<div class="form-group">
<label>Customer Name</label>
<input
type="text"
id="customerName"
placeholder="Enter customer name">
</div>

<div class="form-group">
<label>Phone Number</label>
<input
type="tel"
id="customerPhone"
placeholder="Enter phone number">
</div>

<div class="form-group">
<label>Email Address</label>
<input
type="email"
id="customerEmail"
placeholder="Enter email address">
</div>

<div class="form-group">
<label>Address</label>
<textarea
id="customerAddress"
placeholder="Enter customer address"></textarea>
</div>

<div class="form-group">
<label>Customer Type</label>

<select id="customerType">

<option>Regular Customer</option>
<option>Wholesale Customer</option>
<option>New Customer</option>

</select>

</div>

<div class="form-group">
<label>Date Registered</label>
<input
type="date"
id="customerDate">
</div>

<button class="save" type="submit">
Save Customer
</button>

<button class="clear" type="reset">
Clear
</button>

<button
class="back"
type="button"
onclick="window.location.href='dashboard.html'">

Back to Dashboard

</button>

</form>

<div id="customerResult"></div>

<h2>Customer Records</h2>

<table>

<thead>

<tr>

<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Type</th>

</tr>

</thead>

<tbody id="customerTable">

<tr>

<td colspan="4">
No customers added.
</td>

</tr>

</tbody>

</table>

</div>

<script type="module" src="script.js"></script>

<footer>

© 2026 FinVision Uganda | Version 1.0<br>
Developed by MUBANGIZI EMMANUEL

</footer>

</body>
</html>
