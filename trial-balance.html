<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trial Balance | FinVision Uganda</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef4f8;
color:#333;
}

header{
background:#0B6E4F;
color:white;
text-align:center;
padding:20px;
}

header h1{
margin-bottom:5px;
}

.container{
width:95%;
max-width:1100px;
margin:25px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
color:#0B6E4F;
margin-bottom:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#f8f9fa;
padding:20px;
border-radius:8px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.card h3{
color:#0B6E4F;
margin-bottom:10px;
}

.card p{
font-size:22px;
font-weight:bold;
}

.buttons{
margin-bottom:25px;
}

button{
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
margin-right:10px;
margin-bottom:10px;
transition:.3s;
}

.print{
background:#0d6efd;
color:white;
}

.back{
background:#6c757d;
color:white;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0B6E4F;
color:white;
padding:12px;
}

td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

tfoot td{
font-weight:bold;
background:#f2f2f2;
}

footer{
margin-top:30px;
background:#0B6E4F;
color:white;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>

<p>Trial Balance</p>

</header>

<div class="container">

<h2>Trial Balance</h2>
<div class="summary">

<div class="card">
<h3>Total Debit</h3>
<p id="trialDebit">UGX 0</p>
</div>

<div class="card">
<h3>Total Credit</h3>
<p id="trialCredit">UGX 0</p>
</div>

<div class="card">
<h3>Status</h3>
<p id="trialStatus">Balanced</p>
</div>

</div>

<div class="buttons">

<button
class="print"
onclick="window.print();">
🖨 Print Trial Balance
</button>

<button
class="back"
onclick="window.location.href='dashboard.html';">
🏠 Back to Dashboard
</button>

</div>

<h2>Trial Balance Details</h2>

<table>

<thead>

<tr>

<th>Account</th>
<th>Debit (UGX)</th>
<th>Credit (UGX)</th>

</tr>

</thead>

<tbody id="trialBalanceTable">

<tr>

<td colspan="3">

No Trial Balance Available

</td>

</tr>

</tbody>

<tfoot>

<tr>

<td>
<strong>Totals</strong>
</td>

<td id="footerTrialDebit">
UGX 0
</td>

<td id="footerTrialCredit">
UGX 0
</td>

</tr>

</tfoot>

</table>

<div id="trialMessage"
style="
margin-top:20px;
font-weight:bold;
color:green;
text-align:center;">
</div>
<script>

// Automatically update the balance status
function updateTrialStatus(){

    const debit = Number(
        document.getElementById("trialDebit")
            .innerText
            .replace("UGX","")
            .replace(/,/g,"")
            .trim()
    ) || 0;

    const credit = Number(
        document.getElementById("trialCredit")
            .innerText
            .replace("UGX","")
            .replace(/,/g,"")
            .trim()
    ) || 0;

    const status = document.getElementById("trialStatus");

    if(debit === credit){

        status.innerHTML = "✅ Balanced";
        status.style.color = "green";

    }else{

        status.innerHTML = "❌ Not Balanced";
        status.style.color = "red";

    }

}

// Load Trial Balance automatically
window.onload = function(){

    if(typeof loadTrialBalance === "function"){

        loadTrialBalance();

        // Wait briefly for Firebase data then check balance
        setTimeout(updateTrialStatus,500);

    }

};

</script>

<script type="module" src="script.js"></script>

<footer>

</footer>

</body>
</html>
