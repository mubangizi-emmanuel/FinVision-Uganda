<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinVision Uganda | Expenses</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#dc3545;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
max-width:900px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
color:#dc3545;
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

textarea{
resize:vertical;
height:100px;
}

.buttons{
margin-top:20px;
}

button{
padding:12px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:15px;
margin-right:10px;
}

.save{
background:#198754;
color:white;
}

.clear{
background:#dc3545;
color:white;
}

.back{
background:#6c757d;
color:white;
}

button:hover{
opacity:.9;
}

#expenseResult{
margin-top:15px;
font-weight:bold;
color:#198754;
}

table{
width:100%;
border-collapse:collapse;
margin-top:30px;
}

table th{
background:#dc3545;
color:white;
padding:12px;
}

table td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

footer{
margin-top:30px;
background:#0b6e4f;
color:white;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>FinVision Uganda</h1>
<p>Expense Management</p>

</header>

<div class="container">

<h2>Record New Expense</h2>

<form onsubmit="saveExpense(); return false;">
  <form onsubmit="saveExpense(); return false;">
    <div class="form-group">
<label for="expenseName">Expense Name</label>
<input
type="text"
id="expenseName"
placeholder="Example: Transport"
required>
</div>

<div class="form-group">
<label for="category">Category</label>
<select id="category" required>
<option value="">Select Category</option>
<option>Transport</option>
<option>Rent</option>
<option>Utilities</option>
<option>Salaries</option>
<option>Stock Purchase</option>
<option>Office Supplies</option>
<option>Maintenance</option>
<option>Marketing</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label for="amount">Amount (UGX)</label>
<input
type="number"
id="amount"
placeholder="Enter amount"
required>
</div>

<div class="form-group">
<label for="expenseDate">Date</label>
<input
type="date"
id="expenseDate"
required>
</div>

<div class="form-group">
<label for="paymentMethod">Payment Method</label>
<select id="paymentMethod" required>
<option>Cash</option>
<option>Mobile Money</option>
<option>Bank</option>
</select>
<label>Payment Status</label>

<select id="paymentStatus">

<option value="Paid">Paid</option>
<option value="Unpaid">Unpaid</option>
<option value="Partial">Partial</option>

</select>
</div>

<div class="form-group">
<label for="description">Description</label>
<textarea
id="description"
placeholder="Enter expense details"></textarea>
</div>
<div class="buttons">

<button class="save" type="submit">
Save Expense
</button>

<button class="clear" type="reset">
Clear
</button>

<button
class="back"
type="button"
onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</div>

</form>

<div id="expenseResult"></div>

<h2>Recent Expenses</h2>

<table>

<thead>

<tr>

<th>Expense</th>
<th>Category</th>
<th>Amount (UGX)</th>
<th>Date</th>
<th>Payment</th>

</tr>

</thead>

<tbody id="expenseTable">

<tr>

<td colspan="5">
No expenses recorded.
</td>

</tr>

</tbody>

</table>

</div>

<script type="module" src="script.js"></script>

<footer>

© 2026 FinVision Uganda | Version 1.0<br>
Developed by MUBANGIZI EMMANUEL

</footer>

</body>
</html>
